<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>方式検証: 購入手続きを、サイトのページに組み込む形</title>
  <script src="https://js.stripe.com/endive/stripe.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    button { font-size: 16px; padding: 8px 16px; margin-right: 8px; }
    pre { background: #f5f5f5; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
    .error { color: #b00020; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>方式検証: 購入手続きを、サイトのページに組み込む形</h1>
  <p>生産者のアカウント: __ACCOUNT_ID__ / JCB などを止める指定: __BLOCK__</p>
  <p>購入手続き(Checkout Session): <code id="session-id">(まだない)</code></p>
  <p id="page-error" class="error"></p>

  <section>
    <h2>Stripe が示す額</h2>
    <pre id="total">(読み込み中)</pre>
  </section>

  <section>
    <h2>メールアドレス(Stripe の入力欄)</h2>
    <div id="contact-details-element"></div>
    <h2>支払い方法(Stripe の入力欄)</h2>
    <div id="payment-element"></div>
    <p><button id="confirm" disabled>購入を確定する</button></p>
    <p id="confirm-result" class="error"></p>
  </section>

  <section>
    <h2>確かめ</h2>
    <p>
      <button id="status">状態を読む</button>
      <button id="reset">新しい購入手続きを作る</button>
    </p>
    <pre id="status-result">(まだ読んでいない)</pre>
  </section>

  <script>
    // 同じ購入手続きを、別のタブでも開けるように、ID と client_secret をブラウザーに置く。
    // 「新しい購入手続きを作る」を押すと、捨てて作り直す。
    const KEY = "spike-09-checkout-session";
    const show = (id, text) => { document.getElementById(id).textContent = text; };

    async function loadSession() {
      const stored = localStorage.getItem(KEY);
      if (stored) return JSON.parse(stored);
      const response = await fetch("/session", { method: "POST" });
      const body = await response.json();
      if (!response.ok) throw new Error("購入手続きを作れなかった: " + body.error);
      localStorage.setItem(KEY, JSON.stringify(body));
      return body;
    }

    async function readStatus(id) {
      const response = await fetch("/status?id=" + encodeURIComponent(id));
      show("status-result", JSON.stringify(await response.json(), null, 2));
    }

    async function main() {
      const session = await loadSession();
      show("session-id", session.id);

      document.getElementById("status").addEventListener("click", () => readStatus(session.id));
      document.getElementById("reset").addEventListener("click", () => {
        localStorage.removeItem(KEY);
        location.href = "/";
      });

      // Stripe の側から戻ったとき(支払いのあと)は、状態だけを示す。
      if (new URLSearchParams(location.search).has("returned")) {
        show("total", "(Stripe の側から戻った。下の「状態を読む」の結果を見る)");
        await readStatus(session.id);
        return;
      }

      // 支払いは、生産者のアカウントの上に作る(ダイレクト支払い)。
      const stripe = Stripe("__PUBLISHABLE_KEY__", { stripeAccount: "__ACCOUNT_ID__" });
      const checkout = stripe.initCheckoutElementsSdk({ clientSecret: session.client_secret });

      checkout.on("change", (current) => {
        show("total", JSON.stringify({ canConfirm: current.canConfirm, total: current.total, lineItems: current.lineItems }, null, 2));
        document.getElementById("confirm").disabled = !current.canConfirm;
      });

      checkout.createContactDetailsElement().mount("#contact-details-element");
      checkout.createPaymentElement().mount("#payment-element");

      const loaded = await checkout.loadActions();
      if (loaded.type !== "success") {
        show("page-error", "購入手続きを読み込めなかった: " + JSON.stringify(loaded.error ?? loaded));
        return;
      }

      document.getElementById("confirm").addEventListener("click", async () => {
        show("confirm-result", "(Stripe に送っている)");
        const result = await loaded.actions.confirm();
        // ここに来るのは、すぐに分かる失敗(カードが通らない、止めたブランドなど)のときだけ。
        // 成功したときは、Stripe が return_url に移す。
        show("confirm-result", result.type === "error" ? "失敗: " + JSON.stringify(result.error) : JSON.stringify(result));
        await readStatus(session.id);
      });
    }

    main().catch((err) => show("page-error", String(err && err.message ? err.message : err)));
  </script>
</body>
</html>
