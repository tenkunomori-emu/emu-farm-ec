name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ローカル環境と同じ supabase/config.toml とマイグレーションで起動する(TST-004)。
      # テストで使わないサービスは起動しない。
      - run: npx supabase start -x studio,postgres-meta,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm test
      - run: npm run db:test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # フォークからの PR には、シークレットが渡されない(TST-009)。
      # スキップしたジョブは必須のチェックで成功と同じ扱いになるため、スキップせずに失敗させる。
      - name: CI の Stripe の鍵があることを確認する
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY がありません。フォークからの PR には CI の鍵を渡しません(TST-009)。メンバーが中身を確かめ、このリポジトリのブランチに取り込んでから実行してください。"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # test ジョブと同じ方法で起動する(TST-013)。
      - run: npx supabase start -x studio,postgres-meta,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      # 鍵は、テストを実行するステップにだけ渡す。
      - run: npm run test:integration
        env:
          APP_ENV: development
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_CONNECTED_ACCOUNT_ID: ${{ vars.STRIPE_TEST_CONNECTED_ACCOUNT_ID }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # integration ジョブと同じ理由で、鍵がないときは失敗させる(TST-009)。
      - name: CI の Stripe の鍵があることを確認する
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY がありません。フォークからの PR には CI の鍵を渡しません(TST-009)。メンバーが中身を確かめ、このリポジトリのブランチに取り込んでから実行してください。"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # test ジョブと同じ方法で起動する(TST-013)。
      - run: npx supabase start -x studio,postgres-meta,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
      # 本番と同じビルドで動かす(TST-003)。ビルドには鍵を渡さない。
      - run: npm run build
      # Playwright が next start でアプリを起動する(playwright.config.ts)。鍵は、このステップにだけ渡す。
      - run: npm run test:e2e
        env:
          APP_ENV: development
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_CONNECTED_ACCOUNT_ID: ${{ vars.STRIPE_TEST_CONNECTED_ACCOUNT_ID }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ブラウザに渡さない環境変数。本物の値は使わない。ビルド結果に混入したときに検出できるよう、ダミーの値を入れる。
    env:
      STRIPE_SECRET_KEY: ci-dummy-stripe-secret-key
      STRIPE_WEBHOOK_SECRET: ci-dummy-stripe-webhook-secret
      SUPABASE_SECRET_KEY: ci-dummy-supabase-secret-key
      SUPABASE_PUBLISHABLE_KEY: ci-dummy-supabase-publishable-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # サーバーのコードは、環境変数を実行時に読む。ビルド結果に値があれば、
      # プリレンダリングした HTML か、ブラウザに送る JavaScript に値が入っている(TST-037、AUTH-005)。
      - name: ビルド結果に環境変数の値がないことを確認する
        run: |
          if grep -rlF -e "$STRIPE_SECRET_KEY" -e "$STRIPE_WEBHOOK_SECRET" -e "$SUPABASE_SECRET_KEY" -e "$SUPABASE_PUBLISHABLE_KEY" .next; then
            echo "::error::ビルド結果に、ブラウザに渡さない環境変数の値が含まれています。上のファイルを確認してください。"
            exit 1
          fi

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # PR が追加・更新する依存に、既知の脆弱性があれば失敗する。
      # 例外は、allow-ghsas に勧告の ID を書き、理由をコメントに書く。
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks をダウンロードする
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      # PR のすべてのコミットを調べる(あとのコミットで削除したシークレットも検出する)。
      # マージコミットは、衝突の解消などで手を入れた部分だけを調べる(--diff-merges=remerge)。
      # 設定は .gitleaks.toml。ログは公開されるため、検出した値は --redact で伏せる。
      - run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--diff-merges=remerge ${BASE_SHA}..${HEAD_SHA}"'
